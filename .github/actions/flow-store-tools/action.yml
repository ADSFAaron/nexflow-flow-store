name: flow-store-tools
description: >
  Build NexFlow's flow-store-tools CLI (core/flow-store-tools) at a given ref. The CLI and the
  catalog it checks against (docs/flow-catalog.json) come from the same commit, so they agree.
inputs:
  ref:
    description: A NexFlow branch, tag or commit SHA.
    required: true
outputs:
  bin:
    description: Path of the flow-store-tools executable.
    value: ${{ steps.build.outputs.bin }}
  catalog:
    description: Path of the catalog the CLI validates against.
    value: ${{ steps.build.outputs.catalog }}
  sha:
    description: The NexFlow commit that was built.
    value: ${{ steps.build.outputs.sha }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ADSFAaron/NexFlow
        ref: ${{ inputs.ref }}
        path: nexflow
        persist-credentials: false

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - id: build
      shell: bash
      working-directory: nexflow
      run: |
        ./gradlew --no-daemon -q :core:flow-store-tools:installDist
        {
          echo "bin=$PWD/core/flow-store-tools/build/install/flow-store-tools/bin/flow-store-tools"
          echo "catalog=$PWD/docs/flow-catalog.json"
          echo "sha=$(git rev-parse HEAD)"
        } >> "$GITHUB_OUTPUT"
